# Este arquivo publica (envia) a imagem Docker do projeto para o registry da empresa.
#
# ANTES DE USAR, cadastre neste repositório, em:
#   Settings > Secrets and variables > Actions
#   (use os nomes exatos)
#
#   Aba "Variables" (aparece normal nos logs e no resumo):
#     REGISTRY_URL        -> endereço do registry. Ex: registry.empresa.com
#                            (se preferir, pode ser um Secret; funciona igual)
#
#   Aba "Secrets" (fica escondido):
#     REGISTRY_USERNAME   -> usuário do registry
#     REGISTRY_PASSWORD   -> senha ou token do registry
#                            Docker Hub: REGISTRY_URL=docker.io E, no passo 2,
#                            adicione  name: SEU_USUARIO/app
#     TEAMS_WEBHOOK_URL   -> (opcional) fluxo do Power Automate que avisa no
#                            Teams após o envio. Sem ele, ninguém é avisado.
#     PORTAINER_WEBHOOK_URL -> (opcional) webhook do Portainer para deploy
#                            automático. Para escolher a versão exata, termine
#                            a URL com ?tag={version}

name: Docker
run-name: Publicar imagem Docker

# QUANDO roda:
on:
  push:
    branches: [main]   # automaticamente, sempre que algo novo entrar na branch "main"
  workflow_dispatch:   # ou manualmente: aba Actions > Docker > Run workflow

jobs:
  publish:
    runs-on: ubuntu-latest  # máquina Linux do GitHub que faz o trabalho
    permissions:
      contents: read        # só precisa LER o código do repositório

    # PARA PUBLICAR MAIS DE UMA IMAGEM (ex.: backend e front no mesmo repositório):
    # descomente o bloco "strategy" abaixo, ajuste os valores e, no passo final,
    # descomente as 3 linhas marcadas com "matrix".
    #
    # strategy:
    #   matrix:
    #     include:
    #       - name: meu-backend          # nome da imagem
    #         context: .                 # pasta usada para montar a imagem
    #         dockerfile: Dockerfile     # "receita" da imagem
    #       - name: meu-front
    #         context: front
    #         dockerfile: front/Dockerfile

    steps:
      # Passo 1: baixa o código do repositório
      - uses: actions/checkout@v4

      # Passo 2: monta a imagem, envia para o registry e (opcional) avisa o webhook.
      # Por padrão a imagem tem o nome do repositório e 3 tags: "latest", o código
      # completo do commit e uma tag de versão como 2026.10.14-1532Z-c14ae67
      # (data e hora do commit em UTC + código curto; use-a para rollback).
      # Para mudar o nome: adicione  name: meu-app
      - uses: invicto-dev/docker-push-webhook-action@v2
        with:
          registry_url: ${{ vars.REGISTRY_URL || secrets.REGISTRY_URL }}
          registry_username: ${{ secrets.REGISTRY_USERNAME }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}
          # Avisos depois do envio, um destino por linha (secret que não existe é ignorado):
          #   TEAMS_WEBHOOK_URL     -> fluxo do Power Automate que avisa no Teams
          #   PORTAINER_WEBHOOK_URL -> webhook do Portainer para deploy automático
          # Cada destino recebe um JSON com versão, digest, commit, autor e link da execução.
          webhook_url: |
            ${{ secrets.TEAMS_WEBHOOK_URL }}
            ${{ secrets.PORTAINER_WEBHOOK_URL }}
          # name: ${{ matrix.name }}                  # matrix
          # context: ${{ matrix.context }}            # matrix
          # dockerfile_path: ${{ matrix.dockerfile }} # matrix
