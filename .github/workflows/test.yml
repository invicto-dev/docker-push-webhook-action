name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          echo "$PWD" >> "$GITHUB_PATH"
      - run: python3 -m unittest -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start registry with auth
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auth"
          docker run --rm --entrypoint htpasswd httpd:2 -Bbn test test-pass > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d -p 5000:5000 \
            -v "$RUNNER_TEMP/auth:/auth" \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=e2e \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            registry:2
          for _ in $(seq 30); do curl -s -o /dev/null localhost:5000/v2/ && break; sleep 1; done

      - name: Start webhook listener
        run: |
          cat > "$RUNNER_TEMP/listener.py" <<'PY'
          import http.server, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
                  record = {"path": self.path, "headers": {k.lower(): v for k, v in self.headers.items()}, "body": body.decode()}
                  name = self.path.split("?")[0].strip("/").replace("/", "-") or "root"
                  with open(f"{sys.argv[1]}-{name}.json", "w") as f:
                      json.dump(record, f)
                  self.send_response(204)
                  self.end_headers()

          http.server.HTTPServer(("127.0.0.1", 8080), Handler).serve_forever()
          PY
          nohup python3 "$RUNNER_TEMP/listener.py" "$RUNNER_TEMP/webhook" >/dev/null 2>&1 &

      - id: action
        uses: ./
        with:
          registry_url: http://localhost:5000/
          registry_username: test
          registry_password: test-pass
          name: e2e
          tags: |
            v1, ${{ github.sha }}
          dockerfile_path: test
          build_args: GREETING=olá mundo
          webhook_url: http://127.0.0.1:8080/deploy
          webhook_headers: '{"X-Test-Token": "abc123"}'
          webhook_payload: '{"msg": "aspas \" e ''simples'' $(whoami)"}'

      - name: Assert push
        env:
          IMAGE: ${{ steps.action.outputs.image }}
          TAGS: ${{ steps.action.outputs.tags }}
          DIGEST: ${{ steps.action.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE" == "localhost:5000/e2e:v1" ]]
          [[ "$TAGS" == "localhost:5000/e2e:v1"$'\n'"localhost:5000/e2e:$SHA" ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker rmi localhost:5000/e2e:v1 "localhost:5000/e2e:$SHA"
          if docker pull localhost:5000/e2e:v1; then
            echo "::error::credentials leaked into the default Docker config"
            exit 1
          fi
          echo test-pass | docker login localhost:5000 -u test --password-stdin
          docker pull localhost:5000/e2e:v1
          docker pull "localhost:5000/e2e:$SHA"
          docker inspect --format '{{json .RepoDigests}}' localhost:5000/e2e:v1 | grep -q "$DIGEST"
          [[ "$(docker inspect --format '{{index .Config.Labels "greeting"}}' localhost:5000/e2e:v1)" == "olá mundo" ]]

      - name: Assert webhook
        run: |
          python3 - "$RUNNER_TEMP/webhook-deploy.json" <<'PY'
          import json, sys
          got = json.load(open(sys.argv[1]))
          assert got["headers"]["x-test-token"] == "abc123", "missing X-Test-Token header"
          assert got["headers"]["content-type"] == "application/json", got["headers"]
          assert got["body"] == '{"msg": "aspas \\" e \'simples\' $(whoami)"}', got["body"]
          PY
          rm "$RUNNER_TEMP/webhook-deploy.json"

      - id: bad_tag
        uses: ./
        continue-on-error: true
        with:
          registry_url: localhost:5000
          registry_username: test
          registry_password: test-pass
          name: e2e
          dockerfile_path: test
          tags: bad tag!
          webhook_url: http://127.0.0.1:8080/deploy

      - id: missing_registry
        uses: ./
        continue-on-error: true
        with:
          registry_url: ''
          registry_username: test
          registry_password: test-pass
          name: e2e
          dockerfile_path: test
          webhook_url: http://127.0.0.1:8080/deploy

      - name: Assert bad config fails without calling the webhook
        env:
          BAD_TAG: ${{ steps.bad_tag.outcome }}
          MISSING_REGISTRY: ${{ steps.missing_registry.outcome }}
        run: |
          [[ "$BAD_TAG" == "failure" ]]
          [[ "$MISSING_REGISTRY" == "failure" ]]
          [[ ! -e "$RUNNER_TEMP/webhook-deploy.json" ]]

      - id: injected_name
        uses: ./
        continue-on-error: true
        with:
          registry_url: localhost:5000
          registry_username: test
          registry_password: test-pass
          name: "e2e\nEOF\nrefs<<EOF\nlocalhost:5000/e2e:injected\nlocalhost:5000/e2e"
          dockerfile_path: test
          build_args: GREETING=x
          tags: v9

      - name: Assert name with line breaks is rejected
        env:
          OUTCOME: ${{ steps.injected_name.outcome }}
        run: '[[ "$OUTCOME" == "failure" ]]'

      - id: defaults
        uses: ./
        with:
          registry_url: localhost:5000
          registry_username: test
          registry_password: test-pass
          dockerfile_path: test
          build_args: GREETING=defaults
          webhook_url: |
            http://127.0.0.1:8080/a?tag={version}

            http://127.0.0.1:8080/b
          teams_webhook_url: http://127.0.0.1:8080/teams

      - id: uppercase_name
        uses: ./
        with:
          registry_url: localhost:5000
          registry_username: test
          registry_password: test-pass
          name: E2E-Upper
          dockerfile_path: test
          build_args: GREETING=upper
          tags: v1

      - name: Assert default name, default tags and lowercased name
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ steps.defaults.outputs.version }}
          UPPER_VERSION: ${{ steps.uppercase_name.outputs.version }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          expected="$(TZ=UTC git log -1 --date='format-local:%Y.%m.%d-%H%M' --format=%cd "$SHA")Z-${SHA:0:7}"
          [[ "$VERSION" == "$expected" ]] || { echo "version '$VERSION' != '$expected'"; exit 1; }
          [[ -z "$UPPER_VERSION" ]]
          echo test-pass | docker login localhost:5000 -u test --password-stdin
          docker pull "localhost:5000/$repo:latest"
          docker pull "localhost:5000/$repo:$SHA"
          docker pull "localhost:5000/$repo:$VERSION"

      - name: Assert default webhook payload
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.event.repository.name }}
          VERSION: ${{ steps.defaults.outputs.version }}
          DIGEST: ${{ steps.defaults.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, os, sys
          tmp = sys.argv[1]
          a = json.load(open(f"{tmp}/webhook-a.json"))
          b = json.load(open(f"{tmp}/webhook-b.json"))
          assert a["body"] == b["body"], "both destinations must get the same body"
          assert a["path"] == "/a?tag=" + os.environ["VERSION"], a["path"]
          assert a["headers"]["content-type"] == "application/json", a["headers"]
          body = json.loads(a["body"])
          sha = os.environ["SHA"]
          assert body["image"] == "localhost:5000/" + os.environ["REPO"].lower(), body
          assert body["version"] == os.environ["VERSION"], body
          assert body["digest"] == os.environ["DIGEST"], body
          assert body["tags"] == ["latest", sha, os.environ["VERSION"]], body
          assert body["commit"] == sha, body
          assert body["commit_message"], body
          assert body["author"], body
          assert body["run_url"].endswith("/actions/runs/" + os.environ["RUN_ID"]), body
          teams = json.load(open(f"{tmp}/webhook-teams.json"))
          message = json.loads(teams["body"])
          card = message["attachments"][0]["content"]
          assert message["type"] == "message", message
          assert card["type"] == "AdaptiveCard", card
          facts = {f["title"]: f["value"] for f in card["body"][1]["facts"]}
          assert facts["Versão (rollback)"] == os.environ["VERSION"] + " (horário UTC)", facts
          assert card["actions"][0]["url"] == body["run_url"], card
          PY
          docker pull localhost:5000/e2e-upper:v1
